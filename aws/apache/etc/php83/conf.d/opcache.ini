; OPcache configuration for production
; This provides in-memory bytecode caching for significant performance gains

[opcache]

; ============================================================================
; Core OPcache Settings
; ============================================================================
; Enable OPcache
opcache.enable = 1
; Enable for CLI (useful for artisan commands)
opcache.enable_cli = 0

; ============================================================================
; Memory & Performance
; ============================================================================
; Memory allocated to OPcache in MB (increase for larger codebases)
opcache.memory_consumption = 256
; Max number of keys (files) in the cache (estimate: 1 key per ~5KB of code)
opcache.max_accelerated_files = 16000
; Interned string buffer in MB (reduces memory fragmentation)
opcache.interned_strings_buffer = 16

; ============================================================================
; Validation & Revalidation
; ============================================================================
; Validate timestamps on file check (0 = disabled in production for speed)
opcache.validate_timestamps = 0
; Recheck file timestamps every N seconds (ignored if validate_timestamps=0)
; opcache.revalidate_freq = 60

; ============================================================================
; Optimization Options
; ============================================================================
; Enable aggressive optimizations
opcache.opt_debug_level = 0x00000000
; Allow file override (faster for includes)
opcache.enable_file_override = 1
; Optimize for cycles (improves performance on circular refs)
opcache.optimization_level = 0x7FFEBFFF

; ============================================================================
; Preloading (optional - can preload frequently used files)
; ============================================================================
; opcache.preload = /var/www/html/bootstrap/app.php
; opcache.preload_user = apache

; ============================================================================
; Debugging & Monitoring
; ============================================================================
; Debugging symbols (set to 0 in production)
opcache.save_comments = 1
; Store doc comments (useful for reflection)
opcache.load_comments = 1
; Report warnings during execution
opcache.log_verbosity_level = 2
; Blacklist extensions (file glob patterns to skip)
; opcache.blacklist_filename = /etc/php83/opcache.blacklist

; ============================================================================
; JIT Compilation (PHP 8.3 feature - major performance boost)
; ============================================================================
; Disable JIT in non-production or testing environments
; For production with high load, consider: opcache.jit=function
opcache.jit = function
; JIT buffer size in MB
opcache.jit_buffer_size = 128
