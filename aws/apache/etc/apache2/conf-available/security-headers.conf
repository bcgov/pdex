# Security Headers Configuration
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set X-XSS-Protection "1; mode=block"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://code.jquery.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'self'"

# Remove server information
Header unset Server
Header unset X-Powered-By

# Disable server-status for security
<Location "/server-status">
    Order deny,allow
    Deny from all
</Location>

# Disable server-info
<Location "/server-info">
    Order deny,allow
    Deny from all
</Location>
