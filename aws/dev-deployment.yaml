apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdex-app-dev
  labels:
    app: pdex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdex
  template:
    metadata:
      labels:
        app: pdex
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"

      # You can keep this ServiceAccount if you want, but it no longer needs IRSA/OIDC annotations
      serviceAccountName: pdex-sa-dev

      initContainers:
      - name: secrets-init
        image: busybox:latest
        command: ['sh', '-c']
        args:
        - |
          echo "Processing secrets from Kubernetes Secret..."
          # Read the secret data and convert to .env format
          cd /vault/secrets
          if [ -f secrets.env ]; then
            # If it's JSON format, parse it
            if grep -q '^{' secrets.env; then
              echo "Detected JSON format, converting to .env format..."
              # Extract key-value pairs from JSON and write to temp location
              # Use simple grep/sed to parse JSON (basic approach)
              cat secrets.env | tr -d '{}"\n' | tr ',' '\n' | sed 's/:/=/' > /tmp/secrets.env
            else
              # Already in .env format, just copy
              cp secrets.env /tmp/secrets.env
            fi
          else
            echo "ERROR: secrets.env not found in /vault/secrets"
            exit 1
          fi
          echo "Secrets processed successfully"
          cat /tmp/secrets.env
        volumeMounts:
        - name: pdex-secrets
          mountPath: /vault/secrets
          readOnly: true
        - name: secrets-temp
          mountPath: /tmp

      containers:
      - name: pdex
        image: "${DEV_ECR}:${TAG}"
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8443
          protocol: TCP
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi

        readinessProbe:
          httpGet:
            path: /up
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6

        livenessProbe:
          httpGet:
            path: /up
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5

        volumeMounts:
        - name: pdex-secrets
          mountPath: /vault/secrets
          readOnly: true
        - name: secrets-temp
          mountPath: /tmp
          readOnly: false

      volumes:
      - name: pdex-secrets
        secret:
          secretName: pdex-secrets
          items:
          - key: secrets.env
            path: secrets.env
      - name: secrets-temp
        emptyDir: {}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdex-sa-dev
  namespace: default

---
apiVersion: v1
kind: Service
metadata:
  name: pdex-service-dev
spec:
  selector:
    app: pdex
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pdex-ingress-dev
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
  - host: dev.pdex.gov.bc.ca
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pdex-service-dev
            port:
              number: 80
