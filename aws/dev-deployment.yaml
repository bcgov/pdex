apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdex-app-dev
  labels:
    app: pdex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdex
  template:
    metadata:
      labels:
        app: pdex
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"

      initContainers:
      - name: secrets-init
        image: busybox:latest
        command: ['sh', '-c']
        args:
        - |
          echo "Processing secrets from Kubernetes Secret..."
          # Convert all secret files to .env format
          cd /vault/secrets2
          rm -f /tmp/secrets.env
          for file in *; do
            if [ -f "$file" ]; then
              echo "${file}=$(cat $file)" >> /tmp/secrets.env
            fi
          done
          echo "Secrets processed successfully. Generated .env file:"
          wc -l /tmp/secrets.env
          echo "First 3 lines:"
          head -n 3 /tmp/secrets.env
          
          ######

          echo "Processing secrets from Secrets Manager JSON..."
          set -eu

          src="/vault/secrets/secrets.json"
          out="/secrets/.env"

          if [ ! -f "$src" ]; then
            echo "ERROR: $src not found"
            ls -la /vault/secrets || true
            exit 1
          fi

          mkdir -p /secrets
          rm -f "$out"

          # Convert JSON object to KEY=VALUE lines.
          # - values are coerced to strings
          # - internal newlines are escaped as \n
          jq -r '
            to_entries
            | map("\(.key)=\(.value|tostring|gsub("\r";"")|gsub("\n";"\\n"))")
            | .[]
          ' "$src" > "$out"

          chmod 600 "$out" || true

          echo "Generated $out"
          echo "Line count:"; wc -l "$out"
          echo "First 3 lines:"; head -n 3 "$out"


        volumeMounts:
        - name: pdex-secrets
          mountPath: /vault/secrets2
          readOnly: true
        - name: secrets-temp
          mountPath: /tmp

        - name: sm-csi
          mountPath: /vault/secrets
          readOnly: true
        - name: dotenv-out
          mountPath: /secrets


      containers:
      - name: pdex
        image: "${DEV_ECR}:${TAG}"
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8443
          protocol: TCP
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi

        # readinessProbe:
        #   httpGet:
        #     path: /up
        #     port: 8080
        #   initialDelaySeconds: 10
        #   periodSeconds: 10
        #   timeoutSeconds: 3
        #   failureThreshold: 6

        # livenessProbe:
        #   httpGet:
        #     path: /up
        #     port: 8080
        #   initialDelaySeconds: 30
        #   periodSeconds: 15
        #   timeoutSeconds: 5

        volumeMounts:
        - name: pdex-secrets
          mountPath: /vault/secrets2
          readOnly: true
        - name: secrets-temp
          mountPath: /tmp
          readOnly: false

        - name: dotenv-out
          mountPath: /secrets
          readOnly: true
        - name: sm-csi
          mountPath: /vault/secrets
          readOnly: true

      serviceAccountName: pdex-secret-manager-sa
      volumes:
      - name: pdex-secrets
        secret:
          secretName: pdex-secrets
      - name: secrets-temp
        emptyDir: {}

      - name: sm-csi
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: secrets-json-spc
      - name: dotenv-out
        emptyDir: {}

---
# needed to receive traffic from the ALB. It must match the serviceRef name in alb.tf
apiVersion: v1
kind: Service
metadata:
  name: pdex-service-dev
spec:
  selector:
    app: pdex
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP

