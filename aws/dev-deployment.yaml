---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secrets-json-spc
  namespace: default
spec:
  provider: aws
  parameters:
    region: ca-central-1
    objects: |
      - objectName: "arn:aws:secretsmanager:ca-central-1:814738839437:secret:secrets.env-bV4LPz"
        objectType: "secretsmanager"
        objectAlias: "secrets.json" 
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pdex-secret-manager-sa
  namespace: default
