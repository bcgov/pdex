apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdex-app-dev
  labels:
    app: pdex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdex
  template:
    metadata:
      labels:
        app: pdex
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"

      initContainers:
      - name: secrets-init
        image: busybox:latest
        command: ['sh', '-c']
        args:
        - |
          echo "Processing secrets from Kubernetes Secret..."
          # Convert all secret files to .env format
          cd /vault/secrets
          rm -f /tmp/secrets.env
          for file in *; do
            if [ -f "$file" ]; then
              echo "${file}=$(cat $file)" >> /tmp/secrets.env
            fi
          done
          echo "Secrets processed successfully. Generated .env file:"
          wc -l /tmp/secrets.env
          echo "First 3 lines:"
          head -n 3 /tmp/secrets.env
        volumeMounts:
        - name: pdex-secrets
          mountPath: /vault/secrets
          readOnly: true
        - name: secrets-temp
          mountPath: /tmp

      containers:
      - name: pdex
        image: "${DEV_ECR}:${TAG}"
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8443
          protocol: TCP
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi

        # readinessProbe:
        #   httpGet:
        #     path: /up
        #     port: 8080
        #   initialDelaySeconds: 10
        #   periodSeconds: 10
        #   timeoutSeconds: 3
        #   failureThreshold: 6

        # livenessProbe:
        #   httpGet:
        #     path: /up
        #     port: 8080
        #   initialDelaySeconds: 30
        #   periodSeconds: 15
        #   timeoutSeconds: 5

        volumeMounts:
        - name: pdex-secrets
          mountPath: /vault/secrets
          readOnly: true
        - name: secrets-temp
          mountPath: /tmp
          readOnly: false

      volumes:
      - name: pdex-secrets
        secret:
          secretName: pdex-secrets
      - name: secrets-temp
        emptyDir: {}

