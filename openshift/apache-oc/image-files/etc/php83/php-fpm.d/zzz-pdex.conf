[www]

; Specify the user and group for the pool
user = apache
group = apache

; Using Unix domain socket for maximum performance
listen = /var/run/php-fpm/fpm.sock
listen.owner = apache
listen.group = apache
listen.mode = 0660

; ============================================================================
; Process Manager: dynamic for auto-scaling under load
; ============================================================================
pm = dynamic
; Number of child processes spawned on startup
pm.start_servers = 10
; Minimum number of idle child processes
pm.min_spare_servers = 10
; Maximum number of idle child processes
pm.max_spare_servers = 30
; Maximum number of child processes (supports ~600 VUs under load)
pm.max_children = 100

; ============================================================================
; Request/Process Limits
; ============================================================================
; Maximum number of requests a process handles before respawning (prevents memory leaks)
pm.max_requests = 10000
; Grace period for process restart
pm.max_spare_servers = 30

; How long a request can run before being terminated (30s from app config)
request_terminate_timeout = 30s
; Log requests that exceed this duration (helps identify slow queries)
request_slowlog_timeout = 10s
; Slowlog destination
slowlog = /var/log/php/slowlog.log

; ============================================================================
; Status and Ping Pages (for monitoring)
; ============================================================================
pm.status_path = /status
ping.path = /ping
ping.response = pong

; ============================================================================
; Security & Performance
; ============================================================================
; Catch workers output (send to Apache logs)
catch_workers_output = yes
; Clear environment in FPM workers
clear_env = no

; ============================================================================
; Logging
; ============================================================================
; Pool logging is handled by the main php-fpm.conf
