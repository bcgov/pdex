# Organization and project keys
sonar.organization=bcgov
sonar.projectKey=bcgov_pdex

# Project metadata
sonar.projectName=PDEX - Post-Secondary Digital Exchange
sonar.projectVersion=1.0

# Source code directories
sonar.sources=app,resources/js,resources/views,Modules,routes,config,database,bootstrap

# Test directories (if you have tests)
sonar.tests=tests

# Source file inclusions - focus on PHP and Vue files
sonar.inclusions=**/*.php,**/*.vue,**/*.js,**/*.json,**/*.css,**/*.scss,**/*.xml,**/*.yml

# Exclusions - skip vendor, node_modules, generated files, and build artifacts
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/public/build/**,\
  **/public/js/**,\
  **/public/css/**,\
  **/public/hot/**,\
  **/storage/**,\
  **/bootstrap/cache/**,\
  **/*.min.js,\
  **/*.bundle.js,\
  **/mix-manifest.json,\
  **/_ide_helper.php,\
  **/_ide_helper_models.php,\
  **.phpstorm.meta.php

# Test exclusions
sonar.test.exclusions=\
  **/tests/**,\
  **/database/factories/**,\
  **/database/seeders/**

# Code coverage exclusions (if running coverage)
sonar.coverage.exclusions=\
  **/tests/**,\
  **/database/**,\
  **/config/**,\
  **/bootstrap/**,\
  **/public/**,\
  **/resources/views/**,\
  **/*ServiceProvider.php

# Language-specific settings
sonar.php.version=8.3
sonar.php.coverage.reportPaths=coverage/clover.xml
sonar.php.tests.reportPath=coverage/junit.xml

# JavaScript/Vue.js settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# SCM settings
sonar.scm.provider=git

# Duplication settings - Vue components may have similar structure
sonar.cpd.exclusions=**/*.vue

# Additional quality gate settings
sonar.qualitygate.wait=false
