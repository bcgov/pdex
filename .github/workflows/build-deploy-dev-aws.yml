name: Build and Deploy PDEX in DEV AWS

on:
  push:
    branches:
      - dev-aws

permissions:
  id-token: write
  contents: read

jobs:
  checkEnv:
    name: Check Env variables
    runs-on: ubuntu-latest
    steps:
      - name: Print Env Vars
        run: |
          echo Git Ref Name: ${{ github.ref_name }}

  build:
    name: Build on TOOLS and push to TOOLS ECR
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (TOOLS)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TO_USE_TOOLS }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to TOOLS ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up QEMU (for arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Build & push multi-arch image to TOOLS ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.AWS_ECR_URI_TOOLS }}:${{ github.sha }}
          build-args: |
            GITHUB_SHA=${{ github.sha }}


  deploy:
    name: Mirror to DEV ECR and deploy to EKS (DEV)
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pull from TOOLS
      - name: Configure AWS credentials (TOOLS)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TO_USE_TOOLS }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to TOOLS ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Pull built image from TOOLS
        env:
          TOOLS_ECR: ${{ secrets.AWS_ECR_URI_TOOLS }}
        run: |
          set -euo pipefail
          TAG=${{ github.sha }}
          docker pull ${TOOLS_ECR}:${TAG}

      # Push into DEV
      - name: Configure AWS credentials (DEV)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TO_USE_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to DEV ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Ensure DEV ECR exists
        env:
          DEV_ECR: ${{ secrets.AWS_ECR_URI_DEV }}
        run: |
          set -euo pipefail
          REPO_NAME=$(echo ${DEV_ECR} | awk -F'/' '{print $2}')
          aws ecr describe-repositories --repository-names "${REPO_NAME}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${REPO_NAME}"

            - name: Install skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Copy multi-arch image TOOLS -> DEV (preserve manifest)
        env:
          TOOLS_ECR: ${{ secrets.AWS_ECR_URI_TOOLS }}
          DEV_ECR: ${{ secrets.AWS_ECR_URI_DEV }}
        run: |
          set -euo pipefail
          TAG=${{ github.sha }}
          skopeo copy --all docker://${TOOLS_ECR}:${TAG} docker://${DEV_ECR}:${TAG}


      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Update kubeconfig (DEV)
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name pdex-cluster --region ${{ secrets.AWS_REGION }}

      - name: Deploy to EKS using DEV ECR image
        env:
          DEV_ECR: ${{ secrets.AWS_ECR_URI_DEV }}
        run: |
          set -euo pipefail
          TAG=${{ github.sha }}

          export DEV_ECR="${{ secrets.AWS_ECR_URI_DEV }}"
          export TAG="${{ github.sha }}"

          # Render env vars into the manifest
          envsubst '${DEV_ECR} ${TAG}' < aws/dev-deployment.yaml > aws/dev-deployment.rendered.yaml

          # Always apply; this keeps SA/Service/Ingress/Deployment in sync
          kubectl -n default apply -f aws/dev-deployment.rendered.yaml

          # Patch the container image (no --record)
          kubectl -n default set image deploy/pdex-app-dev pdex=${DEV_ECR}:${TAG}

      - name: Wait for rollout
        run: |
          set -euo pipefail

          # Wait for rollout
          kubectl -n default rollout status deploy/pdex-app-dev --timeout=10m

          # Wait for pods to be ready
          kubectl -n default wait --for=condition=ready pod -l app=pdex --timeout=10m || kubectl -n default describe pod -l app=pdex


      - name: Docker logout
        run: |
          set -euo pipefail
          docker logout

      - name: Finished AWS Deploy
        run: echo "FINISHED AWS Deploy DEV PDEX"
