name: Build and Deploy PDEX in DEV AWS

on:
  push:
    branches:
      - dev-aws

permissions:
  id-token: write
  contents: read

jobs:
  checkEnv:
    name: Check Env variables
    runs-on: ubuntu-latest
    steps:
      - name: Print Env Vars
        run: |
          echo Git Ref Name: ${{ github.ref_name }}

  build:
    name: Build on TOOLS and push to TOOLS ECR
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (TOOLS)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TO_USE_TOOLS }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to TOOLS ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & push image to TOOLS ECR
        env:
          TOOLS_ECR: ${{ secrets.AWS_ECR_URI_TOOLS }}
        run: |
          TAG=${{ github.sha }}
          docker build . -t ${TOOLS_ECR}:${TAG} --build-arg GITHUB_SHA=${TAG}
          docker push ${TOOLS_ECR}:${TAG}

  deploy:
    name: Mirror to DEV ECR and deploy to EKS (DEV)
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pull from TOOLS
      - name: Configure AWS credentials (TOOLS)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TO_USE_TOOLS }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to TOOLS ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Pull built image from TOOLS
        env:
          TOOLS_ECR: ${{ secrets.AWS_ECR_URI_TOOLS }}
        run: |
          TAG=${{ github.sha }}
          docker pull ${TOOLS_ECR}:${TAG}

      # Push into DEV
      - name: Configure AWS credentials (DEV)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TO_USE_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to DEV ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Ensure DEV ECR exists
        env:
          DEV_ECR: ${{ secrets.AWS_ECR_URI_DEV }}
        run: |
          REPO_NAME=$(echo ${DEV_ECR} | awk -F'/' '{print $2}')
          aws ecr describe-repositories --repository-names "${REPO_NAME}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${REPO_NAME}"

      - name: Retag & push to DEV ECR
        env:
          TOOLS_ECR: ${{ secrets.AWS_ECR_URI_TOOLS }}
          DEV_ECR: ${{ secrets.AWS_ECR_URI_DEV }}
        run: |
          TAG=${{ github.sha }}
          docker tag ${TOOLS_ECR}:${TAG} ${DEV_ECR}:${TAG}
          docker push ${DEV_ECR}:${TAG}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Update kubeconfig (DEV)
        run: |
          aws eks update-kubeconfig --name pdex-cluster --region ${{ secrets.AWS_REGION }}

      - name: Deploy to EKS using DEV ECR image
        env:
          DEV_ECR: ${{ secrets.AWS_ECR_URI_DEV }}
        run: |
          TAG=${{ github.sha }}
          # Patch the running deployment's image (no sed; safer)
          kubectl -n default set image deployment/pdex-app-dev pdex=${DEV_ECR}:${TAG} --record
          kubectl -n default rollout status deployment/pdex-app-dev --timeout=5m

      - name: Finished AWS Deploy
        run: echo "FINISHED AWS Deploy DEV PDEX"
