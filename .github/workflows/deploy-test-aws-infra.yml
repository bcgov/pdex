name: Deploy PDEX Infrastructure in TEST AWS

on:
  pull_request:
    branches: [ test-aws-infra ]
    types: [ closed ]

env:
  TF_VERSION: 1.12.2
  TG_VERSION: 0.83.2
  TG_SRC_PATH: terraform
  TFC_WORKSPACE: test

permissions:
  id-token: write
  contents: read

jobs:
  # Print variables for logging and debugging purposes
  checkEnv:
    name: Check Env variables
    runs-on: ubuntu-latest
    steps:
    - name: Print Env Vars
      run: |
        echo Git Base Ref: ${{ github.base_ref }}
        echo Git Build ID: ${{ github.event.number }}
        echo Git Pull Request Ref: ${{ github.event.pull_request.head.sha }}
        echo Git Ref Name: ${{ github.ref_name }}

  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    # Use the Bash shell regardless of the GitHub Actions runner OS
    defaults:
      run:
        shell: bash

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TO_USE_TEST }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: ${{ env.TG_VERSION }}

      - name: Create S3 bucket for Terraform state if it doesn't exist
        run: |
          BUCKET_NAME="terraform-remote-state-pdex-test"
          if ! aws s3 ls "s3://${BUCKET_NAME}" 2>&1 > /dev/null; then
            echo "Creating S3 bucket ${BUCKET_NAME}..."
            aws s3api create-bucket --bucket ${BUCKET_NAME} --region ca-central-1 --create-bucket-configuration LocationConstraint=ca-central-1
            aws s3api put-bucket-versioning --bucket ${BUCKET_NAME} --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket ${BUCKET_NAME} --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            echo "S3 bucket ${BUCKET_NAME} created successfully"
          else
            echo "S3 bucket ${BUCKET_NAME} already exists"
          fi

      - name: Terragrunt Apply
        working-directory: ${{ env.TG_SRC_PATH }}/${{ env.TFC_WORKSPACE }}
        env:
          TF_INPUT: "0" # Disable interactive input
          TF_VAR_vpc_id: "vpc-0beb5c99b7f010268"
          TF_VAR_environment_name: "Test"
          TF_VAR_certificate_arn: "arn:aws:acm:ca-central-1:634503648219:certificate/6be85c83-ddc5-4676-a415-c8041b678097"
          TF_VAR_source_token: ${{ secrets.AWS_HEADER_TOKEN_TEST }}
          TF_VAR_cloudfront_origin_domain: "test.pdex.gov.bc.ca.ca-central-1.elb.amazonaws.com"
          # TF_VAR_cloudfront_certificate_arn: "arn:aws:acm:us-east-1:814738839437:certificate/4e46dda5-00b6-49b4-869a-5529077cf4db"
          TF_VAR_github_actions_role_arn: ${{ secrets.AWS_ROLE_ARN_TO_USE_TEST }}
        run: |

          terragrunt run-all validate --non-interactive
          terragrunt run-all plan --non-interactive
          terragrunt run-all apply --non-interactive

      - name: Finished Terragrunt Apply
        run: |
          echo "FINISHED OC Deploy Infrastructure on AWS TEST for PDEX"
          echo ++++++++++
          