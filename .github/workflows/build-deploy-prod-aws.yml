name: Build and Deploy PDEX in PROD AWS

on:
  pull_request:
    branches: [ main ]
    types: [ closed ]

permissions:
  id-token: write
  contents: read

jobs:
  checkEnv:
    name: Check Env variables
    runs-on: ubuntu-latest
    steps:
      - name: Print Env Vars
        run: |
          echo Git Ref Name: ${{ github.ref_name }}

  build:
    name: Build on TOOLS and push to TOOLS ECR
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (TOOLS)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TO_USE_TOOLS }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to TOOLS ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & push image to TOOLS ECR
        env:
          TOOLS_ECR: ${{ secrets.AWS_ECR_URI_TOOLS }}
        run: |
          set -euo pipefail
          TAG=${{ github.sha }}
          docker build .  --platform linux/amd64 -t ${TOOLS_ECR}:${TAG} --build-arg GITHUB_SHA=${TAG}
          docker push ${TOOLS_ECR}:${TAG}

  deploy:
    name: Mirror to PROD ECR and deploy to EKS (PROD)
    needs: build
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pull from TOOLS
      - name: Configure AWS credentials (TOOLS)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TO_USE_TOOLS }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to TOOLS ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Pull built image from TOOLS
        env:
          TOOLS_ECR: ${{ secrets.AWS_ECR_URI_TOOLS }}
        run: |
          set -euo pipefail
          TAG=${{ github.sha }}
          docker pull ${TOOLS_ECR}:${TAG}

      # Push into PROD
      - name: Configure AWS credentials (PROD)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TO_USE_PROD }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to PROD ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Ensure PROD ECR exists
        env:
          PROD_ECR: ${{ secrets.AWS_ECR_URI_PROD }}
        run: |
          set -euo pipefail
          REPO_NAME=$(echo ${PROD_ECR} | awk -F'/' '{print $2}')
          aws ecr describe-repositories --repository-names "${REPO_NAME}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${REPO_NAME}"

      - name: Retag & push to PROD ECR
        env:
          TOOLS_ECR: ${{ secrets.AWS_ECR_URI_TOOLS }}
          PROD_ECR: ${{ secrets.AWS_ECR_URI_PROD }}
        run: |
          set -euo pipefail
          TAG=${{ github.sha }}
          docker tag ${TOOLS_ECR}:${TAG} ${PROD_ECR}:${TAG}
          docker push ${PROD_ECR}:${TAG}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Update kubeconfig (PROD)
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name pdex-cluster --region ${{ secrets.AWS_REGION }}
          
          # Verify we can connect
          kubectl cluster-info
          kubectl get nodes || echo "Warning: Cannot list nodes yet, cluster may still be initializing"

      - name: Deploy to EKS using PROD ECR image
        env:
          PROD_ECR: ${{ secrets.AWS_ECR_URI_PROD }}
        run: |
          set -euo pipefail
          TAG=${{ github.sha }}

          export PROD_ECR="${{ secrets.AWS_ECR_URI_PROD }}"
          export PROD_SECRETS_ECR="${{ secrets.AWS_SM_URI_PROD }}"
          export TAG="${{ github.sha }}"

          # Render env vars into the manifest
          envsubst '${PROD_ECR} ${TAG} ${PROD_SECRETS_ECR}' < aws/prod-deployment.yaml > aws/prod-deployment.rendered.yaml

          # Always apply; this keeps SA/Service/Ingress/Deployment in sync
          kubectl -n default apply -f aws/prod-deployment.rendered.yaml

          # Patch the container image (no --record)
          kubectl -n default set image deploy/pdex-app-prod pdex=${PROD_ECR}:${TAG}

      - name: Wait for rollout
        run: |
          set -euo pipefail

          # Wait for rollout
          kubectl -n default rollout status deploy/pdex-app-prod --timeout=10m

          # Wait for pods to be ready
          kubectl -n default wait --for=condition=ready pod -l app=pdex --timeout=10m || kubectl -n default describe pod -l app=pdex


      - name: Docker logout
        run: |
          set -euo pipefail
          docker logout

      - name: Finished AWS Deploy
        run: echo "FINISHED AWS Deploy PROD PDEX"
