name: Deploy PDEX Infrastructure in DEV AWS

on:
  pull_request:
    branches: [ dev-aws-infra ]
    types: [ closed ]

env:
  TF_VERSION: 1.12.2
  TG_VERSION: 0.83.2
  TG_SRC_PATH: terraform
  TFC_WORKSPACE: dev

permissions:
  id-token: write
  contents: read

jobs:
  # Print variables for logging and debugging purposes
  checkEnv:
    name: Check Env variables
    runs-on: ubuntu-latest
    steps:
    - name: Print Env Vars
      run: |
        echo Git Base Ref: ${{ github.base_ref }}
        echo Git Build ID: ${{ github.event.number }}
        echo Git Pull Request Ref: ${{ github.event.pull_request.head.sha }}
        echo Git Ref Name: ${{ github.ref_name }}

  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    # Use the Bash shell regardless of the GitHub Actions runner OS
    defaults:
      run:
        shell: bash

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TO_USE_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: ${{ env.TG_VERSION }}

      # - name: Debug backend + state
      #   working-directory: ${{ env.TG_SRC_PATH }}/${{ env.TFC_WORKSPACE }}
      #   run: |
      #     set -e

      #     echo "=== list generated backend.tf ==="
      #     find . -maxdepth 4 -name backend.tf -print -exec sed -n '1,80p' {} \;

      #     echo "=== terraform init backend info ==="
      #     # Shows backend type and some details (safe)
      #     terraform -chdir=. init -backend=false >/dev/null 2>&1 || true

      #     echo "=== terraform state list ==="
      #     terragrunt state list --non-interactive || true

      #     echo "=== terraform state pull (first lines) ==="
      #     terragrunt state pull --non-interactive | head -n 40 || true

      - name: Create S3 bucket for Terraform state if it doesn't exist
        run: |
          BUCKET_NAME="terraform-remote-state-pdex-dev"
          if ! aws s3 ls "s3://${BUCKET_NAME}" 2>&1 > /dev/null; then
            echo "Creating S3 bucket ${BUCKET_NAME}..."
            aws s3api create-bucket --bucket ${BUCKET_NAME} --region ca-central-1 --create-bucket-configuration LocationConstraint=ca-central-1
            aws s3api put-bucket-versioning --bucket ${BUCKET_NAME} --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket ${BUCKET_NAME} --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            echo "S3 bucket ${BUCKET_NAME} created successfully"
          else
            echo "S3 bucket ${BUCKET_NAME} already exists"
          fi


      - name: Terragrunt Init
        working-directory: ${{ env.TG_SRC_PATH }}/${{ env.TFC_WORKSPACE }}
        run: terragrunt run-all init --non-interactive


      # - name: Terragrunt Import ALB SG (one-time)
      #   working-directory: ${{ env.TG_SRC_PATH }}/${{ env.TFC_WORKSPACE }}
      #   env:
      #     TF_VAR_vpc_id: "vpc-0beb5c99b7f010268"
      #     TF_VAR_environment_name: "Dev"
      #     TF_VAR_certificate_arn: "arn:aws:acm:ca-central-1:814738839437:certificate/b885894d-c4c1-4742-bc0d-88a8136eac68"
      #     TF_VAR_source_token: ${{ secrets.AWS_HEADER_TOKEN_DEV }}

      #   run: |
      #     terragrunt import aws_iam_role.efs_csi efs-csi-role --non-interactive
      #     terragrunt import aws_iam_role.eks_ng eks-ng-role --non-interactive
      #     terragrunt import aws_iam_role.cluster_auto_scaler cluster_auto_scaler_role --non-interactive
      #     terragrunt import aws_iam_role.ses_mailer ses_mailer_role --non-interactive
      #     terragrunt import aws_iam_policy.alb_policy arn:aws:iam::814738839437:policy/AWSLoadBalancerControllerIAMPolicy-Dev --non-interactive


      #     terragrunt import aws_elasticache_replication_group.pdex_redis_rg pdex-rep-group --non-interactive


      #     terragrunt plan

      - name: Terragrunt Apply
        working-directory: ${{ env.TG_SRC_PATH }}/${{ env.TFC_WORKSPACE }}
        env:
          TF_VAR_vpc_id: "vpc-0beb5c99b7f010268"
          TF_VAR_environment_name: "Dev"
          TF_VAR_certificate_arn: "arn:aws:acm:ca-central-1:814738839437:certificate/b885894d-c4c1-4742-bc0d-88a8136eac68"
          TF_VAR_source_token: ${{ secrets.AWS_HEADER_TOKEN_DEV }}
          TF_VAR_cloudfront_origin_domain: "dev.pdex.gov.bc.ca.ca-central-1.elb.amazonaws.com"
          TF_VAR_cloudfront_certificate_arn: "arn:aws:acm:us-east-1:814738839437:certificate/4e46dda5-00b6-49b4-869a-5529077cf4db"
          TF_VAR_github_actions_role_arn: ${{ secrets.AWS_ROLE_ARN_TO_USE_DEV }}
        run: terragrunt run-all apply --non-interactive

      - name: Finished Terragrunt Apply
        run: |
          echo "FINISHED OC Deploy Infrastructure on AWS DEV for PDEX"
          echo ++++++++++
          