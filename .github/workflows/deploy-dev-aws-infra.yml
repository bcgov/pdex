name: Deploy PDEX Infrastructure in DEV AWS

on:
  pull_request:
    branches: [ dev-aws-infra ]
    types: [ closed ]

env:
  TF_VERSION: 1.12.2
  TG_VERSION: 0.83.2
  TG_SRC_PATH: terraform
  TFC_WORKSPACE: dev

permissions:
  id-token: write
  contents: read

jobs:
  # Print variables for logging and debugging purposes
  checkEnv:
    name: Check Env variables
    runs-on: ubuntu-latest
    steps:
    - name: Print Env Vars
      run: |
        echo Git Base Ref: ${{ github.base_ref }}
        echo Git Build ID: ${{ github.event.number }}
        echo Git Pull Request Ref: ${{ github.event.pull_request.head.sha }}
        echo Git Ref Name: ${{ github.ref_name }}

  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    # Use the Bash shell regardless of the GitHub Actions runner OS
    defaults:
      run:
        shell: bash

    steps:
      # Checkout the repository
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_TO_USE_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version: ${{ env.TG_VERSION }}

      - name: Terragrunt Init
        working-directory: ${{ env.TG_SRC_PATH }}/${{ env.TFC_WORKSPACE }}
        env:
          LICENSE_PLATE: ${{ secrets.MY_LICENSE_PLATE }}
        run: terragrunt init

      - name: Import Existing AWS Resources
        working-directory: ${{ env.TG_SRC_PATH }}/${{ env.TFC_WORKSPACE }}
        env:
          LICENSE_PLATE: ${{ secrets.MY_LICENSE_PLATE }}
        continue-on-error: true
        run: |
          # Function to safely import resources
          safe_import() {
            local resource=$1
            local id=$2
            echo "Attempting to import $resource with id $id"
            terragrunt import "$resource" "$id" 2>&1 | grep -v "Error: Cannot import non-existent" || true
          }
          
          # Skip importing security groups that are attached to active resources (RDS, Redis, etc)
          # These will be created fresh by Terraform
          # Import standalone ALB security group
          echo "=== Importing ALB Security Group ==="
          ALB_SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=alb-https-sg" "Name=vpc-id,Values=vpc-0beb5c99b7f010268" --query "SecurityGroups[0].GroupId" --output text --region ca-central-1 2>/dev/null || echo "")
          if [ ! -z "$ALB_SG_ID" ] && [ "$ALB_SG_ID" != "None" ]; then
            echo "Found ALB SG: $ALB_SG_ID"
            safe_import "aws_security_group.alb_sg" "$ALB_SG_ID"
          else
            echo "ALB security group not found, will be created"
          fi
          
          # Import other security groups
          echo "=== Importing NFS Security Group ==="
          NFS_SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=allow_nfs" "Name=vpc-id,Values=vpc-0beb5c99b7f010268" --query "SecurityGroups[0].GroupId" --output text --region ca-central-1 2>/dev/null || echo "")
          if [ ! -z "$NFS_SG_ID" ] && [ "$NFS_SG_ID" != "None" ]; then
            echo "Found NFS SG: $NFS_SG_ID"
            safe_import "aws_security_group.allow_nfs" "$NFS_SG_ID"
          fi
          
          echo "=== Importing Postgres Security Group ==="
          PG_SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=allow_postgres" "Name=vpc-id,Values=vpc-0beb5c99b7f010268" --query "SecurityGroups[0].GroupId" --output text --region ca-central-1 2>/dev/null || echo "")
          if [ ! -z "$PG_SG_ID" ] && [ "$PG_SG_ID" != "None" ]; then
            echo "Found Postgres SG: $PG_SG_ID"
            safe_import "aws_security_group.allow_postgres" "$PG_SG_ID"
          fi
          
          echo "=== Importing Redis Security Group ==="
          REDIS_SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=allow_redis" "Name=vpc-id,Values=vpc-0beb5c99b7f010268" --query "SecurityGroups[0].GroupId" --output text --region ca-central-1 2>/dev/null || echo "")
          if [ ! -z "$REDIS_SG_ID" ] && [ "$REDIS_SG_ID" != "None" ]; then
            echo "Found Redis SG: $REDIS_SG_ID"
            safe_import "aws_security_group.allow_redis" "$REDIS_SG_ID"
          fi
          
          echo "=== Importing TLS Security Group ==="
          TLS_SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=allow_tls" "Name=vpc-id,Values=vpc-0beb5c99b7f010268" --query "SecurityGroups[0].GroupId" --output text --region ca-central-1 2>/dev/null || echo "")
          if [ ! -z "$TLS_SG_ID" ] && [ "$TLS_SG_ID" != "None" ]; then
            echo "Found TLS SG: $TLS_SG_ID"
            safe_import "aws_security_group.allow_tls" "$TLS_SG_ID"
          fi
          
          # Import Target Groups - with existence check
          for tg_name in cer-target-group cdq-target-group pdex-target-group; do
            TG_ARN=$(aws elbv2 describe-target-groups --names "$tg_name" --query "TargetGroups[0].TargetGroupArn" --output text --region ca-central-1 2>/dev/null || echo "")
            if [ ! -z "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
              resource_name=$(echo "$tg_name" | cut -d'-' -f1)
              safe_import "aws_alb_target_group.$resource_name" "$TG_ARN"
            fi
          done
          
          # Import ALB
          ALB_ARN=$(aws elbv2 describe-load-balancers --names default --query "LoadBalancers[0].LoadBalancerArn" --output text --region ca-central-1 2>/dev/null || echo "")
          if [ ! -z "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            safe_import "aws_lb.default_alb" "$ALB_ARN"
            
            # Import ALB Listener (HTTPS on port 443)
            echo "=== Importing ALB HTTPS Listener ==="
            LISTENER_ARN=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" --query "Listeners[?Port==\`443\`].ListenerArn" --output text --region ca-central-1 2>/dev/null || echo "")
            if [ ! -z "$LISTENER_ARN" ] && [ "$LISTENER_ARN" != "None" ]; then
              echo "Found HTTPS listener: $LISTENER_ARN"
              safe_import "aws_lb_listener.https_listener" "$LISTENER_ARN"
              
              # Import listener rules
              echo "=== Importing ALB Listener Rules ==="
              RULE_ARNS=$(aws elbv2 describe-rules --listener-arn "$LISTENER_ARN" --query "Rules[?!IsDefault].RuleArn" --output text --region ca-central-1 2>/dev/null || echo "")
              if [ ! -z "$RULE_ARNS" ]; then
                for rule_arn in $RULE_ARNS; do
                  echo "Found listener rule: $rule_arn"
                  # Extract priority to determine which resource to import
                  PRIORITY=$(aws elbv2 describe-rules --rule-arns "$rule_arn" --query "Rules[0].Priority" --output text --region ca-central-1 2>/dev/null || echo "")
                  if [ "$PRIORITY" == "10" ]; then
                    safe_import "aws_lb_listener_rule.healthcheck_fixed_response" "$rule_arn"
                  elif [ "$PRIORITY" == "100" ]; then
                    safe_import "aws_lb_listener_rule.cer" "$rule_arn"
                  elif [ "$PRIORITY" == "200" ]; then
                    safe_import "aws_lb_listener_rule.cdq" "$rule_arn"
                  elif [ "$PRIORITY" == "300" ]; then
                    safe_import "aws_lb_listener_rule.pdex" "$rule_arn"
                  fi
                done
              fi
            else
              echo "HTTPS listener not found"
            fi
          fi
          
          # Import RDS - with existence checks
          if aws rds describe-db-subnet-groups --db-subnet-group-name data-subnet --region ca-central-1 2>/dev/null | grep -q "DBSubnetGroupName"; then
            safe_import "aws_db_subnet_group.data_subnet" "data-subnet"
          fi
          
          if aws rds describe-db-clusters --db-cluster-identifier pdex-postgres-cluster --region ca-central-1 2>/dev/null | grep -q "DBClusterIdentifier"; then
            safe_import "aws_rds_cluster.postgres-pdex" "pdex-postgres-cluster"
            RDS_INSTANCE=$(aws rds describe-db-clusters --db-cluster-identifier pdex-postgres-cluster --query "DBClusters[0].DBClusterMembers[0].DBInstanceIdentifier" --output text --region ca-central-1 2>/dev/null || echo "")
            if [ ! -z "$RDS_INSTANCE" ] && [ "$RDS_INSTANCE" != "None" ]; then
              safe_import "aws_rds_cluster_instance.postgres-pdex" "$RDS_INSTANCE"
            fi
          fi
          
          # Import ElastiCache
          if aws elasticache describe-cache-subnet-groups --cache-subnet-group-name redis-subnet-group-laravel --region ca-central-1 2>/dev/null | grep -q "CacheSubnetGroupName"; then
            safe_import "aws_elasticache_subnet_group.default" "redis-subnet-group-laravel"
          fi
          
          if aws elasticache describe-replication-groups --replication-group-id pdex-rep-group --region ca-central-1 2>/dev/null | grep -q "ReplicationGroupId"; then
            safe_import "aws_elasticache_replication_group.pdex_redis_rg" "pdex-rep-group"
            safe_import 'aws_elasticache_cluster.replica[0]' "pdex-rep-group-0"
          fi
          
          # Import EFS
          EFS_ID=$(aws efs describe-file-systems --creation-token pdex-cer-efs --query "FileSystems[0].FileSystemId" --output text --region ca-central-1 2>/dev/null || echo "")
          if [ ! -z "$EFS_ID" ] && [ "$EFS_ID" != "None" ]; then
            safe_import "aws_efs_file_system.pdex-cer" "$EFS_ID"
            MT_IDS=$(aws efs describe-mount-targets --file-system-id "$EFS_ID" --query "MountTargets[*].MountTargetId" --output text --region ca-central-1 2>/dev/null || echo "")
            MT_ARRAY=($MT_IDS)
            if [ ${#MT_ARRAY[@]} -ge 1 ]; then safe_import "aws_efs_mount_target.data_azA" "${MT_ARRAY[0]}"; fi
            if [ ${#MT_ARRAY[@]} -ge 2 ]; then safe_import "aws_efs_mount_target.data_azB" "${MT_ARRAY[1]}"; fi
          fi
          
          # Import KMS
          if aws kms describe-key --key-id 43934437-94a9-4668-bfbf-b5394622743a --region ca-central-1 2>/dev/null | grep -q "KeyId"; then
            safe_import "aws_kms_key.pdex-kms-key" "43934437-94a9-4668-bfbf-b5394622743a"
          fi
          
          
          # Import IAM Service-Linked Role for OpenSearch
          echo "=== Importing IAM Service-Linked Role for OpenSearch ==="
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if aws iam get-role --role-name AWSServiceRoleForAmazonElasticsearchService 2>/dev/null | grep -q "RoleName"; then
            echo "Found IAM service-linked role for OpenSearch"
            safe_import "aws_iam_service_linked_role.es" "arn:aws:iam::${ACCOUNT_ID}:role/aws-service-role/es.amazonaws.com/AWSServiceRoleForAmazonElasticsearchService"
          else
            echo "IAM service-linked role not found, will be created"
          fi
          
          # Import EKS Cluster
          echo "=== Importing EKS Cluster ==="
          if aws eks describe-cluster --name pdex-cluster --region ca-central-1 2>/dev/null | grep -q "cluster"; then
            echo "Found EKS cluster: pdex-cluster"
            safe_import "aws_eks_cluster.pdex-cluster" "pdex-cluster"
            
            # Import EKS Node Groups
            echo "=== Importing EKS Node Groups ==="
            NODE_GROUPS=$(aws eks list-nodegroups --cluster-name pdex-cluster --query "nodegroups" --output text --region ca-central-1 2>/dev/null || echo "")
            if [ ! -z "$NODE_GROUPS" ]; then
              for ng in $NODE_GROUPS; do
                echo "Found node group: $ng"
                safe_import "aws_eks_node_group.pdex-cluster" "pdex-cluster:$ng"
              done
            else
              echo "No node groups found"
            fi
          else
            echo "EKS cluster not found, will be created"
          fi
          
          # Import IAM resources
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          
          for role in eks-cluster-role efs-csi-role eks-ng-role cluster_auto_scaler_role ses_mailer_role AWSLoadBalancerControllerIAMRole; do
            if aws iam get-role --role-name "$role" 2>/dev/null | grep -q "RoleName"; then
              resource_name=$(echo "$role" | sed 's/AWSLoadBalancerControllerIAMRole/alb_role/')
              safe_import "aws_iam_role.$resource_name" "$role"
            fi
          done
          
          if aws iam get-policy --policy-arn "arn:aws:iam::${ACCOUNT_ID}:policy/AWSLoadBalancerControllerIAMPolicy" 2>/dev/null | grep -q "PolicyName"; then
            safe_import "aws_iam_policy.alb_policy" "arn:aws:iam::${ACCOUNT_ID}:policy/AWSLoadBalancerControllerIAMPolicy"
          fi
          
          echo "Import step completed successfully (errors ignored)"

      - name: Terragrunt Apply
        working-directory: ${{ env.TG_SRC_PATH }}/${{ env.TFC_WORKSPACE }}
        env:
          LICENSE_PLATE: ${{ secrets.MY_LICENSE_PLATE }}
        run: terragrunt run-all apply --non-interactive


      - name: Finished Terragrunt Apply
        run: |
          echo "FINISHED OC Deploy Infrastructure on AWS DEV for PDEX"
          echo ++++++++++
          